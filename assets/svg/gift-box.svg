<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 64 64" 
     width="64" height="64"
     role="img" 
     aria-label="صندوق جایزه">

  <defs>
    <!-- گرادیانت بدنه جعبه (قرمز یاقوتی) -->
    <linearGradient id="giftBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#e11d48"/>
      <stop offset="40%"  stop-color="#c81e1e"/>
      <stop offset="80%"  stop-color="#8b0000"/>
      <stop offset="100%" stop-color="#4a0000"/>
    </linearGradient>

    <!-- گرادیانت درب جعبه (کمی روشن‌تر) -->
    <linearGradient id="giftLid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ff4d6d"/>
      <stop offset="50%"  stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <!-- گرادیانت روبان طلایی -->
    <linearGradient id="giftRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fff7c2"/>
      <stop offset="30%"  stop-color="#ffd700"/>
      <stop offset="70%"  stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8b6300"/>
    </linearGradient>

    <!-- گرادیانت گره روبان -->
    <radialGradient id="giftBow" cx="35%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#fff7c2"/>
      <stop offset="50%"  stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </radialGradient>

    <!-- هایلایت براق -->
    <radialGradient id="giftShine" cx="30%" cy="25%" r="40%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- هاله درخشش بیرونی -->
    <radialGradient id="giftAura" cx="50%" cy="50%" r="50%">
      <stop offset="55%"  stop-color="#ffd700" stop-opacity="0"/>
      <stop offset="82%"  stop-color="#ffd700" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>

    <!-- فیلتر درخشش -->
    <filter id="giftGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- هاله درخشش بیرونی -->
  <circle cx="32" cy="32" r="31" fill="url(#giftAura)"/>

  <!-- سایه پایین -->
  <ellipse cx="32" cy="58" rx="18" ry="2.5" 
           fill="#000000" opacity="0.45"/>

  <!-- ============ جعبه هدیه ============ -->
  <g filter="url(#giftGlow)">

    <!-- ============ بدنه جعبه ============ -->
    <rect x="12" y="28" width="40" height="28" rx="3" ry="3"
          fill="url(#giftBody)"
          stroke="#4a0000"
          stroke-width="0.8"/>

    <!-- خط برجسته پایین بدنه -->
    <line x1="14" y1="54" x2="50" y2="54"
          stroke="#4a0000"
          stroke-width="0.5"
          opacity="0.6"/>

    <!-- ============ روبان عمودی روی بدنه ============ -->
    <rect x="28" y="28" width="8" height="28"
          fill="url(#giftRibbon)"
          stroke="#6b4c00"
          stroke-width="0.5"/>

    <!-- خط میانی روبان عمودی (برجستگی) -->
    <line x1="32" y1="28" x2="32" y2="56"
          stroke="#8b6300"
          stroke-width="0.4"
          opacity="0.7"/>

    <!-- ============ درب جعبه ============ -->
    <rect x="10" y="22" width="44" height="10" rx="2" ry="2"
          fill="url(#giftLid)"
          stroke="#4a0000"
          stroke-width="0.8"/>

    <!-- خط برجسته بالای درب -->
    <line x1="12" y1="24" x2="52" y2="24"
          stroke="#ff8a9e"
          stroke-width="0.6"
          opacity="0.7"/>

    <!-- ============ روبان عمودی روی درب ============ -->
    <rect x="28" y="22" width="8" height="10"
          fill="url(#giftRibbon)"
          stroke="#6b4c00"
          stroke-width="0.5"/>

    <!-- خط میانی روبان روی درب -->
    <line x1="32" y1="22" x2="32" y2="32"
          stroke="#8b6300"
          stroke-width="0.4"
          opacity="0.7"/>

    <!-- ============ گره روبان (Bow) ============ -->
    <!-- حلقه چپ -->
    <path d="M 32 22 
             C 22 20, 16 14, 18 8 
             C 20 4, 28 6, 32 18 Z"
          fill="url(#giftBow)"
          stroke="#6b4c00"
          stroke-width="0.6"
          stroke-linejoin="round"/>

    <!-- حلقه راست -->
    <path d="M 32 22 
             C 42 20, 48 14, 46 8 
             C 44 4, 36 6, 32 18 Z"
          fill="url(#giftBow)"
          stroke="#6b4c00"
          stroke-width="0.6"
          stroke-linejoin="round"/>

    <!-- گره وسط -->
    <ellipse cx="32" cy="20" rx="4" ry="3.5"
             fill="url(#giftBow)"
             stroke="#6b4c00"
             stroke-width="0.6"/>

    <!-- هایلایت گره وسط -->
    <ellipse cx="31" cy="19" rx="1.8" ry="1.2"
             fill="#ffffff"
             opacity="0.6"/>

    <!-- ============ هایلایت‌های براق ============ -->
    <!-- روی بدنه (چپ) -->
    <ellipse cx="20" cy="38" rx="3" ry="7"
             fill="url(#giftShine)"
             opacity="0.6"/>

    <!-- روی درب -->
    <ellipse cx="18" cy="26" rx="5" ry="2"
             fill="url(#giftShine)"
             opacity="0.7"/>

    <!-- ============ ستاره‌های براق (sparkles) ============ -->
    <g fill="#ffffff" opacity="0.95">
      <path d="M 50 12 L 50.7 14 L 52.7 14.7 L 50.7 15.4 L 50 17.4 L 49.3 15.4 L 47.3 14.7 L 49.3 14 Z"/>
      <path d="M 12 14 L 12.5 15.5 L 14 16 L 12.5 16.5 L 12 18 L 11.5 16.5 L 10 16 L 11.5 15.5 Z"/>
    </g>
    <circle cx="50" cy="14.7" r="0.6" fill="#ffffff"/>
    <circle cx="12" cy="16" r="0.5" fill="#ffffff"/>

  </g>
</svg>