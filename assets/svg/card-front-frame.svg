<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 200 300" 
     width="200" height="300"
     role="img" 
     aria-label="قاب کارت بازی">

  <defs>
    <!-- پس‌زمینه کرمی -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#fdfbf3"/>
      <stop offset="50%"  stop-color="#f5f0e1"/>
      <stop offset="100%" stop-color="#e8dcc0"/>
    </linearGradient>

    <!-- قاب طلایی -->
    <linearGradient id="cardGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fff7c2"/>
      <stop offset="25%"  stop-color="#ffd700"/>
      <stop offset="55%"  stop-color="#d4af37"/>
      <stop offset="80%"  stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#8b6300"/>
    </linearGradient>

    <!-- هایلایت براق -->
    <linearGradient id="cardShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- برش گوشه‌ها -->
    <clipPath id="cardClip">
      <rect x="0" y="0" width="200" height="300" rx="18" ry="18"/>
    </clipPath>

    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#cardClip)">

    <!-- پس‌زمینه -->
    <rect x="0" y="0" width="200" height="300" fill="url(#cardBg)"/>

    <!-- ============ قاب طلایی بیرونی ============ -->
    <rect x="6" y="6" width="188" height="288" rx="14" ry="14"
          fill="none"
          stroke="url(#cardGold)"
          stroke-width="2.5"
          filter="url(#cardGlow)"/>

    <!-- قاب داخلی نازک -->
    <rect x="12" y="12" width="176" height="276" rx="10" ry="10"
          fill="none"
          stroke="url(#cardGold)"
          stroke-width="0.8"
          opacity="0.7"/>

    <!-- ============ گوشه‌های تزئینی (Flourish) ============ -->
    <g stroke="url(#cardGold)" stroke-width="1.2" fill="none" 
       stroke-linecap="round" stroke-linejoin="round">
      <!-- بالا-چپ -->
      <path d="M 18 18 Q 18 32 32 32"/>
      <path d="M 18 18 Q 32 18 32 32"/>
      <circle cx="24" cy="24" r="1.5" fill="#ffd700" stroke="none"/>
      <!-- بالا-راست -->
      <path d="M 182 18 Q 182 32 168 32"/>
      <path d="M 182 18 Q 168 18 168 32"/>
      <circle cx="176" cy="24" r="1.5" fill="#ffd700" stroke="none"/>
      <!-- پایین-چپ -->
      <path d="M 18 282 Q 18 268 32 268"/>
      <path d="M 18 282 Q 32 282 32 268"/>
      <circle cx="24" cy="276" r="1.5" fill="#ffd700" stroke="none"/>
      <!-- پایین-راست -->
      <path d="M 182 282 Q 182 268 168 268"/>
      <path d="M 182 282 Q 168 282 168 268"/>
      <circle cx="176" cy="276" r="1.5" fill="#ffd700" stroke="none"/>
    </g>

    <!-- ============ جای عدد و خال بالا-چپ ============ -->
    <g transform="translate(28 38)">
      <!-- سایه عدد -->
      <text x="0" y="0"
            text-anchor="middle"
            font-family="Playfair Display, serif"
            font-size="18"
            font-weight="700"
            fill="#8b6300"
            opacity="0.3">A</text>
      <!-- عدد اصلی -->
      <text x="0" y="-1"
            text-anchor="middle"
            font-family="Playfair Display, serif"
            font-size="18"
            font-weight="700"
            fill="#1a1a1a">A</text>
      <!-- سیمبل خال (جای خالی) -->
      <circle cx="0" cy="12" r="3" fill="none" stroke="#8b6300" stroke-width="0.5" stroke-dasharray="1 1"/>
    </g>

    <!-- ============ جای عدد و خال پایین-راست (چرخیده) ============ -->
    <g transform="translate(172 262) rotate(180)">
      <text x="0" y="0"
            text-anchor="middle"
            font-family="Playfair Display, serif"
            font-size="18"
            font-weight="700"
            fill="#8b6300"
            opacity="0.3">A</text>
      <text x="0" y="-1"
            text-anchor="middle"
            font-family="Playfair Display, serif"
            font-size="18"
            font-weight="700"
            fill="#1a1a1a">A</text>
      <circle cx="0" cy="12" r="3" fill="none" stroke="#8b6300" stroke-width="0.5" stroke-dasharray="1 1"/>
    </g>

    <!-- ============ ناحیه مرکزی (جای سیمبل بزرگ) ============ -->
    <rect x="50" y="80" width="100" height="140" rx="6" ry="6"
          fill="none"
          stroke="url(#cardGold)"
          stroke-width="0.5"
          stroke-dasharray="3 3"
          opacity="0.4"/>

    <!-- نشان مرکزی (دایره تزئینی) -->
    <circle cx="100" cy="150" r="32"
            fill="none"
            stroke="url(#cardGold)"
            stroke-width="0.8"
            opacity="0.5"/>

    <!-- نقطه مرکزی -->
    <circle cx="100" cy="150" r="2" fill="#d4af37" opacity="0.7"/>

    <!-- ============ هایلایت براق بالا-چپ ============ -->
    <path d="M 0 0 L 100 0 L 100 40 Q 50 30 0 60 Z"
          fill="url(#cardShine)"/>

    <!-- ============ برچسب پایین ============ -->
    <text x="100" y="290"
          text-anchor="middle"
          font-family="Playfair Display, serif"
          font-size="7"
          letter-spacing="2"
          fill="#8b6300"
          opacity="0.5">
      HOKM PRO
    </text>

  </g>

  <!-- خط دور -->
  <rect x="0" y="0" width="200" height="300" rx="18" ry="18"
        fill="none"
        stroke="rgba(0,0,0,0.4)"
        stroke-width="0.8"/>
</svg>