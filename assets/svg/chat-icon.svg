<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 64 64" 
     width="64" height="64"
     role="img" 
     aria-label="چت دوستان">

  <defs>
    <!-- گرادیانت حباب گفتگو -->
    <linearGradient id="chatBubble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#fff7c2"/>
      <stop offset="30%"  stop-color="#ffd700"/>
      <stop offset="70%"  stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8b6300"/>
    </linearGradient>

    <!-- گرادیانت حباب دوم (کوچک‌تر) -->
    <linearGradient id="chatBubbleSmall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f5f0e1"/>
      <stop offset="50%"  stop-color="#d4c685"/>
      <stop offset="100%" stop-color="#a89560"/>
    </linearGradient>

    <!-- گرادیانت نقطه‌ها -->
    <radialGradient id="chatDot" cx="35%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#8b6300"/>
      <stop offset="100%" stop-color="#4a3300"/>
    </radialGradient>

    <!-- هایلایت براق -->
    <radialGradient id="chatShine" cx="30%" cy="25%" r="35%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- هاله درخشش -->
    <radialGradient id="chatAura" cx="50%" cy="50%" r="50%">
      <stop offset="55%"  stop-color="#ffd700" stop-opacity="0"/>
      <stop offset="82%"  stop-color="#ffd700" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>

    <filter id="chatGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- هاله + سایه -->
  <circle cx="32" cy="32" r="31" fill="url(#chatAura)"/>
  <ellipse cx="32" cy="58" rx="18" ry="2.5" fill="#000000" opacity="0.4"/>

  <g filter="url(#chatGlow)">

    <!-- ============ حباب گفتگوی اصلی ============ -->
    <path d="M 10 14 
             Q 10 8, 16 8 
             L 48 8 
             Q 54 8, 54 14 
             L 54 32 
             Q 54 38, 48 38 
             L 22 38 
             L 14 46 
             L 14 38 
             L 16 38 
             Q 10 38, 10 32 
             Z"
          fill="url(#chatBubble)"
          stroke="#6b4c00"
          stroke-width="0.9"
          stroke-linejoin="round"/>

    <!-- خط برجسته بالای حباب -->
    <path d="M 14 12 Q 14 10, 16 10 L 48 10 Q 50 10, 50 12"
          fill="none" stroke="#fff7c2" stroke-width="0.6" opacity="0.7"/>

    <!-- ============ ۳ نقطه طلایی وسط ============ -->
    <g fill="url(#chatDot)">
      <circle cx="22" cy="23" r="2.8"/>
      <circle cx="32" cy="23" r="2.8"/>
      <circle cx="42" cy="23" r="2.8"/>
    </g>
    <!-- هایلایت روی نقطه‌ها -->
    <g fill="#fff7c2" opacity="0.8">
      <circle cx="21" cy="22" r="0.8"/>
      <circle cx="31" cy="22" r="0.8"/>
      <circle cx="41" cy="22" r="0.8"/>
    </g>

    <!-- ============ حباب دوم (کوچک، پایین-راست) ============ -->
    <path d="M 42 42 
             Q 42 38, 46 38 
             L 56 38 
             Q 60 38, 60 42 
             L 60 50 
             Q 60 54, 56 54 
             L 54 54 
             L 54 58 
             L 50 54 
             L 46 54 
             Q 42 54, 42 50 
             Z"
          fill="url(#chatBubbleSmall)"
          stroke="#6b4c00"
          stroke-width="0.7"
          stroke-linejoin="round"/>

    <!-- ۳ نقطه کوچک در حباب دوم -->
    <g fill="#4a3300">
      <circle cx="47" cy="46" r="1.2"/>
      <circle cx="51" cy="46" r="1.2"/>
      <circle cx="55" cy="46" r="1.2"/>
    </g>

    <!-- ============ هایلایت براق ============ -->
    <ellipse cx="20" cy="14" rx="5" ry="2.5"
             fill="url(#chatShine)"
             opacity="0.6"
             transform="rotate(-15 20 14)"/>
    <circle cx="19" cy="13" r="0.8" fill="#ffffff" opacity="0.9"/>

    <!-- ============ sparkle ============ -->
    <g fill="#ffffff" opacity="0.9">
      <path d="M 8 34 L 8.6 35.7 L 10.3 36.3 L 8.6 36.9 L 8 38.6 L 7.4 36.9 L 5.7 36.3 L 7.4 35.7 Z"/>
    </g>
    <circle cx="8" cy="36.3" r="0.4" fill="#ffffff"/>

  </g>
</svg>