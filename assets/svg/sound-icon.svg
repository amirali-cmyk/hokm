<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 64 64" 
     width="64" height="64"
     role="img" 
     aria-label="صدا">

  <defs>
    <!-- گرادیانت بلندگو -->
    <linearGradient id="sndSpeaker" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fff7c2"/>
      <stop offset="30%"  stop-color="#ffd700"/>
      <stop offset="70%"  stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8b6300"/>
    </linearGradient>

    <!-- گرادیانت امواج -->
    <linearGradient id="sndWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>

    <!-- هایلایت براق -->
    <radialGradient id="sndShine" cx="32%" cy="28%" r="35%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- هاله درخشش -->
    <radialGradient id="sndAura" cx="50%" cy="50%" r="50%">
      <stop offset="55%"  stop-color="#ffd700" stop-opacity="0"/>
      <stop offset="82%"  stop-color="#ffd700" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>

    <filter id="sndGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- هاله -->
  <circle cx="32" cy="32" r="31" fill="url(#sndAura)"/>

  <g filter="url(#sndGlow)">

    <!-- ============ بلندگو ============ -->
    <!-- بدنه بلندگو -->
    <path d="M 10 24 
             L 18 24 
             L 28 16 
             L 28 48 
             L 18 40 
             L 10 40 
             Z"
          fill="url(#sndSpeaker)"
          stroke="#6b4c00"
          stroke-width="0.8"
          stroke-linejoin="round"/>

    <!-- خط برجسته روی بلندگو -->
    <line x1="19" y1="22" x2="19" y2="42"
          stroke="#8b6300"
          stroke-width="0.5"
          opacity="0.5"/>

    <!-- ============ امواج صوتی (۳ عدد) ============ -->
    <!-- موج کوچک -->
    <path d="M 34 24 Q 38 32, 34 40"
          fill="none"
          stroke="url(#sndWave)"
          stroke-width="2.2"
          stroke-linecap="round"/>

    <!-- موج متوسط -->
    <path d="M 40 18 Q 46 32, 40 46"
          fill="none"
          stroke="url(#sndWave)"
          stroke-width="2.2"
          stroke-linecap="round"
          opacity="0.85"/>

    <!-- موج بزرگ -->
    <path d="M 46 12 Q 54 32, 46 52"
          fill="none"
          stroke="url(#sndWave)"
          stroke-width="2.2"
          stroke-linecap="round"
          opacity="0.65"/>

    <!-- ============ هایلایت براق روی بلندگو ============ -->
    <ellipse cx="16" cy="28" rx="2" ry="4"
             fill="url(#sndShine)"
             opacity="0.7"
             transform="rotate(-15 16 28)"/>
    <circle cx="15" cy="27" r="0.6" fill="#ffffff" opacity="0.95"/>

    <!-- ============ sparkle ============ -->
    <g fill="#ffffff" opacity="0.9">
      <path d="M 52 8 L 52.6 9.7 L 54.3 10.3 L 52.6 10.9 L 52 12.6 L 51.4 10.9 L 49.7 10.3 L 51.4 9.7 Z"/>
    </g>
    <circle cx="52" cy="10.3" r="0.5" fill="#ffffff"/>

  </g>
</svg>