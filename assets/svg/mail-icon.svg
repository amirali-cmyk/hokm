<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 64 64" 
     width="64" height="64"
     role="img" 
     aria-label="پیام و دعوت">

  <defs>
    <!-- گرادیانت بدنه پاکت -->
    <linearGradient id="mailBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f5f0e1"/>
      <stop offset="40%"  stop-color="#d4c685"/>
      <stop offset="100%" stop-color="#a89560"/>
    </linearGradient>

    <!-- گرادیانت درپوش پاکت (طلایی) -->
    <linearGradient id="mailFlap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#fff7c2"/>
      <stop offset="40%"  stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>

    <!-- گرادیانت نامه (سفید کرمی) -->
    <linearGradient id="mailLetter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f0e1"/>
    </linearGradient>

    <!-- گرادیانت مهر طلایی -->
    <radialGradient id="mailSeal" cx="35%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#fff7c2"/>
      <stop offset="40%"  stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#8b6300"/>
    </radialGradient>

    <!-- هاله درخشش -->
    <radialGradient id="mailAura" cx="50%" cy="50%" r="50%">
      <stop offset="55%"  stop-color="#ffd700" stop-opacity="0"/>
      <stop offset="82%"  stop-color="#ffd700" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>

    <filter id="mailGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- هاله + سایه -->
  <circle cx="32" cy="32" r="31" fill="url(#mailAura)"/>
  <ellipse cx="32" cy="58" rx="18" ry="2.5" fill="#000000" opacity="0.4"/>

  <g filter="url(#mailGlow)">

    <!-- ============ نامه بیرون‌زده (پشت پاکت) ============ -->
    <rect x="14" y="18" width="36" height="26" rx="2" ry="2"
          fill="url(#mailLetter)"
          stroke="#a89560"
          stroke-width="0.6"/>

    <!-- خطوط نامه -->
    <line x1="18" y1="24" x2="46" y2="24"
          stroke="#a89560" stroke-width="0.6" opacity="0.6"/>
    <line x1="18" y1="28" x2="42" y2="28"
          stroke="#a89560" stroke-width="0.6" opacity="0.6"/>
    <line x1="18" y1="32" x2="44" y2="32"
          stroke="#a89560" stroke-width="0.6" opacity="0.6"/>

    <!-- ============ بدنه پاکت ============ -->
    <rect x="10" y="30" width="44" height="22" rx="2" ry="2"
          fill="url(#mailBody)"
          stroke="#6b4c00"
          stroke-width="0.8"/>

    <!-- خطوط چین پاکت (X) -->
    <path d="M 10 30 L 32 44 L 54 30"
          fill="none"
          stroke="#8b6300"
          stroke-width="0.7"
          stroke-linejoin="round"
          opacity="0.7"/>

    <!-- ============ درپوش پاکت (بالا) ============ -->
    <path d="M 10 30 
             L 32 18 
             L 54 30 
             L 54 32 
             L 32 22 
             L 10 32 Z"
          fill="url(#mailFlap)"
          stroke="#6b4c00"
          stroke-width="0.7"
          stroke-linejoin="round"/>

    <!-- هایلایت روی درپوش -->
    <path d="M 14 30 L 32 20 L 36 21 L 18 31 Z"
          fill="#ffffff"
          opacity="0.4"/>

    <!-- ============ مهر طلایی وسط ============ -->
    <g transform="translate(32 36)">
      <!-- دایره اصلی مهر -->
      <circle r="5" fill="url(#mailSeal)" stroke="#6b4c00" stroke-width="0.6"/>
      <!-- حلقه داخلی -->
      <circle r="3.2" fill="none" stroke="#8b6300" stroke-width="0.4" opacity="0.6"/>
      <!-- ستاره کوچک وسط -->
      <path d="M 0 -1.8 L 0.5 -0.5 L 1.8 0 L 0.5 0.5 L 0 1.8 L -0.5 0.5 L -1.8 0 L -0.5 -0.5 Z"
            fill="#fff7c2"/>
      <!-- هایلایت -->
      <circle cx="-1.2" cy="-1.2" r="0.7" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- ============ sparkles ============ -->
    <g fill="#ffffff" opacity="0.95">
      <path d="M 52 10 L 52.7 12 L 54.7 12.7 L 52.7 13.4 L 52 15.4 L 51.3 13.4 L 49.3 12.7 L 51.3 12 Z"/>
      <path d="M 10 18 L 10.5 19.5 L 12 20 L 10.5 20.5 L 10 22 L 9.5 20.5 L 8 20 L 9.5 19.5 Z"/>
    </g>
    <circle cx="52" cy="12.7" r="0.6" fill="#ffffff"/>
    <circle cx="10" cy="20" r="0.4" fill="#ffffff"/>

  </g>
</svg>