<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 64 64" 
     width="64" height="64"
     role="img" 
     aria-label="تغییر تم">

  <defs>
    <!-- گرادیانت خورشید -->
    <radialGradient id="dmSun" cx="35%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#fff7c2"/>
      <stop offset="40%"  stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </radialGradient>

    <!-- گرادیانت ماه -->
    <linearGradient id="dmMoon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f5f0e1"/>
      <stop offset="50%"  stop-color="#d4c685"/>
      <stop offset="100%" stop-color="#8a7d4e"/>
    </linearGradient>

    <!-- گرادیانت پس‌زمینه (شب) -->
    <radialGradient id="dmBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#1a3028"/>
      <stop offset="100%" stop-color="#0a1512"/>
    </radialGradient>

    <!-- هایلایت براق -->
    <radialGradient id="dmShine" cx="32%" cy="28%" r="35%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- هاله درخشش -->
    <radialGradient id="dmAura" cx="50%" cy="50%" r="50%">
      <stop offset="55%"  stop-color="#ffd700" stop-opacity="0"/>
      <stop offset="82%"  stop-color="#ffd700" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>

    <filter id="dmGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- هاله + پس‌زمینه -->
  <circle cx="32" cy="32" r="31" fill="url(#dmAura)"/>
  <circle cx="32" cy="32" r="26" fill="url(#dmBg)" stroke="url(#dmMoon)" stroke-width="0.6" opacity="0.85"/>

  <g filter="url(#dmGlow)">

    <!-- ============ خورشید (بالا-چپ) ============ -->
    <g transform="translate(22 22)">
      <!-- پرتوها -->
      <g stroke="url(#dmSun)" stroke-width="1.5" stroke-linecap="round">
        <line x1="0" y1="-12" x2="0" y2="-9"/>
        <line x1="0" y1="12"  x2="0" y2="9"/>
        <line x1="-12" y1="0" x2="-9" y2="0"/>
        <line x1="12"  y1="0" x2="9"  y2="0"/>
        <line x1="-8.5" y1="-8.5" x2="-6.4" y2="-6.4"/>
        <line x1="8.5"  y1="-8.5" x2="6.4"  y2="-6.4"/>
        <line x1="-8.5" y1="8.5"  x2="-6.4" y2="6.4"/>
        <line x1="8.5"  y1="8.5"  x2="6.4"  y2="6.4"/>
      </g>
      <!-- بدنه خورشید -->
      <circle r="6.5" fill="url(#dmSun)" stroke="#8b6300" stroke-width="0.6"/>
      <circle cx="-1.5" cy="-1.5" r="1.2" fill="#ffffff" opacity="0.85"/>
    </g>

    <!-- ============ ماه (پایین-راست) ============ -->
    <g transform="translate(43 43)">
      <!-- هلال ماه -->
      <path d="M 0 -10 
               Q 10 -8, 10 0 
               Q 10 8, 0 10 
               Q 6 4, 6 0 
               Q 6 -4, 0 -10 Z"
            fill="url(#dmMoon)"
            stroke="#6b4c00"
            stroke-width="0.5"/>
      <!-- هایلایت -->
      <circle cx="2" cy="-1" r="0.8" fill="#ffffff" opacity="0.6"/>
    </g>

    <!-- ============ خط جداکننده منحنی (وسط) ============ -->
    <path d="M 14 32 Q 32 14, 50 32 Q 32 50, 14 32 Z"
          fill="none"
          stroke="url(#dmMoon)"
          stroke-width="0.8"
          opacity="0.4"
          stroke-dasharray="2 2"/>

    <!-- ============ ۲ ستاره کوچک ============ -->
    <g fill="#ffffff" opacity="0.9">
      <path d="M 20 44 L 20.4 45.3 L 21.7 45.7 L 20.4 46.1 L 20 47.4 L 19.6 46.1 L 18.3 45.7 L 19.6 45.3 Z"/>
      <path d="M 46 18 L 46.4 19.3 L 47.7 19.7 L 46.4 20.1 L 46 21.4 L 45.6 20.1 L 44.3 19.7 L 45.6 19.3 Z"/>
    </g>

    <!-- ============ sparkle ============ -->
    <g fill="#ffffff" opacity="0.9">
      <path d="M 54 8 L 54.6 9.7 L 56.3 10.3 L 54.6 10.9 L 54 12.6 L 53.4 10.9 L 51.7 10.3 L 53.4 9.7 Z"/>
    </g>

  </g>
</svg>