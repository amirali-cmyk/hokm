<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 64 64" 
     width="64" height="64"
     role="img" 
     aria-label="تاج VIP">

  <defs>
    <!-- گرادیانت بدنه تاج -->
    <linearGradient id="crownBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#fff7c2"/>
      <stop offset="25%"  stop-color="#ffd700"/>
      <stop offset="60%"  stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8b6300"/>
    </linearGradient>

    <!-- گرادیانت نوار پایین تاج -->
    <linearGradient id="crownBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffe066"/>
      <stop offset="50%"  stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#6b4c00"/>
    </linearGradient>

    <!-- گرادیانت یاقوت قرمز وسط -->
    <radialGradient id="crownRuby" cx="35%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#ff8a9e"/>
      <stop offset="40%"  stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>

    <!-- گرادیانت یاقوت کبود کناری -->
    <radialGradient id="crownSapphire" cx="35%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#93c5fd"/>
      <stop offset="40%"  stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>

    <!-- گرادیانت زمرد -->
    <radialGradient id="crownEmerald" cx="35%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#6ee7b7"/>
      <stop offset="40%"  stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>

    <!-- هاله درخشش طلایی -->
    <radialGradient id="crownAura" cx="50%" cy="50%" r="50%">
      <stop offset="45%"  stop-color="#ffd700" stop-opacity="0"/>
      <stop offset="75%"  stop-color="#ffd700" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>

    <!-- هایلایت براق -->
    <radialGradient id="crownShine" cx="35%" cy="25%" r="30%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- فیلتر درخشش طلایی -->
    <filter id="crownGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- هاله درخشش بیرونی -->
  <circle cx="32" cy="32" r="30" fill="url(#crownAura)"/>

  <!-- سایه پایین (حس شناور بودن) -->
  <ellipse cx="32" cy="54" rx="16" ry="2.5" 
           fill="#000000" opacity="0.4"/>

  <!-- ============ تاج ============ -->
  <g filter="url(#crownGlow)">

    <!-- بدنه اصلی تاج (سه نوک) -->
    <path d="M 10 42 
             L 10 28 
             L 18 34 
             L 24 22 
             L 32 32 
             L 40 22 
             L 46 34 
             L 54 28 
             L 54 42 
             Z"
          fill="url(#crownBody)" 
          stroke="#6b4c00" 
          stroke-width="0.7" 
          stroke-linejoin="round"/>

    <!-- لبه‌های برجسته تاج -->
    <path d="M 10 42 L 10 28 L 18 34 L 24 22 L 32 32 L 40 22 L 46 34 L 54 28 L 54 42"
          fill="none"
          stroke="#fff3b0"
          stroke-width="0.6"
          opacity="0.7"/>

    <!-- خط داخلی بدنه -->
    <path d="M 12 40 L 12 30 L 19 35 L 25 25 L 32 33 L 39 25 L 45 35 L 52 30 L 52 40"
          fill="none"
          stroke="#8b6300"
          stroke-width="0.4"
          opacity="0.6"/>

    <!-- ============ نوار پایین تاج ============ -->
    <rect x="8" y="42" width="48" height="8" rx="2" ry="2"
          fill="url(#crownBase)"
          stroke="#6b4c00"
          stroke-width="0.7"/>

    <!-- خط برجسته نوار پایین -->
    <line x1="10" y1="43" x2="54" y2="43"
          stroke="#fff3b0"
          stroke-width="0.5"
          opacity="0.8"/>
    <line x1="10" y1="49" x2="54" y2="49"
          stroke="#6b4c00"
          stroke-width="0.4"
          opacity="0.7"/>

    <!-- ============ جواهرات روی نوار ============ -->
    <!-- یاقوت وسط -->
    <g transform="translate(32 46)">
      <ellipse rx="3.5" ry="3.2" fill="url(#crownRuby)"/>
      <ellipse rx="1.2" ry="1" fill="#ff8a9e" opacity="0.8"/>
      <circle cx="-0.8" cy="-0.8" r="0.5" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- یاقوت کبود چپ -->
    <g transform="translate(18 46)">
      <circle r="2.2" fill="url(#crownSapphire)"/>
      <circle cx="-0.6" cy="-0.6" r="0.5" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- یاقوت کبود راست -->
    <g transform="translate(46 46)">
      <circle r="2.2" fill="url(#crownSapphire)"/>
      <circle cx="-0.6" cy="-0.6" r="0.5" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- ============ مروارید روی سه نوک ============ -->
    <!-- نوک چپ -->
    <g transform="translate(18 34)">
      <circle r="2.8" fill="url(#crownBody)" stroke="#6b4c00" stroke-width="0.5"/>
      <circle cx="-0.8" cy="-0.8" r="0.9" fill="#ffffff" opacity="0.9"/>
    </g>
    <!-- نوک وسط (بالاتر) -->
    <g transform="translate(32 22)">
      <circle r="3.2" fill="url(#crownBody)" stroke="#6b4c00" stroke-width="0.5"/>
      <circle cx="-1" cy="-1" r="1" fill="#ffffff" opacity="0.95"/>
      <!-- ستاره کوچک روی نوک وسط -->
      <path d="M 0 -6 L 0.8 -2.5 L 4 -1.2 L 0.8 0.1 L 0 3.5 L -0.8 0.1 L -4 -1.2 L -0.8 -2.5 Z"
            fill="#fff7c2"
            stroke="#d4af37"
            stroke-width="0.3"
            opacity="0.95"/>
    </g>
    <!-- نوک راست -->
    <g transform="translate(46 34)">
      <circle r="2.8" fill="url(#crownBody)" stroke="#6b4c00" stroke-width="0.5"/>
      <circle cx="-0.8" cy="-0.8" r="0.9" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- ============ زمرد کوچک روی نوک‌ها (بین دو مروارید) ============ -->
    <g transform="translate(25 28)">
      <polygon points="0,-2 2,0 0,2 -2,0"
               fill="url(#crownEmerald)"
               stroke="#064e3b"
               stroke-width="0.3"/>
    </g>
    <g transform="translate(39 28)">
      <polygon points="0,-2 2,0 0,2 -2,0"
               fill="url(#crownEmerald)"
               stroke="#064e3b"
               stroke-width="0.3"/>
    </g>

    <!-- ============ هایلایت براق ============ -->
    <ellipse cx="20" cy="30" rx="6" ry="3"
             fill="url(#crownShine)"
             opacity="0.75"
             transform="rotate(-25 20 30)"/>
    <circle cx="20" cy="29" r="0.9" fill="#ffffff" opacity="0.95"/>

    <!-- ============ ستاره براق (sparkle) ============ -->
    <g fill="#ffffff" opacity="0.95">
      <path d="M 52 18 L 52.8 20.5 L 55.3 21.3 L 52.8 22.1 L 52 24.6 L 51.2 22.1 L 48.7 21.3 L 51.2 20.5 Z"/>
    </g>
    <circle cx="52" cy="21.3" r="0.7" fill="#ffffff"/>
    <circle cx="11" cy="24" r="0.6" fill="#ffffff" opacity="0.8"/>

  </g>
</svg>