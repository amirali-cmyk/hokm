<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 64 64" 
     width="64" height="64"
     role="img" 
     aria-label="چرخ شانس">

  <defs>
    <!-- گرادیانت قاب بیرونی -->
    <linearGradient id="slotFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fff7c2"/>
      <stop offset="25%"  stop-color="#ffd700"/>
      <stop offset="55%"  stop-color="#d4af37"/>
      <stop offset="80%"  stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#8b6300"/>
    </linearGradient>

    <!-- گرادیانت سوزن -->
    <linearGradient id="slotNeedle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ff6b7f"/>
      <stop offset="50%"  stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <!-- گرادیانت مرکز چرخ -->
    <radialGradient id="slotHub" cx="35%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#fff7c2"/>
      <stop offset="40%"  stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#8b6300"/>
    </radialGradient>

    <!-- هاله درخشش -->
    <radialGradient id="slotAura" cx="50%" cy="50%" r="50%">
      <stop offset="55%"  stop-color="#ffd700" stop-opacity="0"/>
      <stop offset="82%"  stop-color="#ffd700" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>

    <filter id="slotGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- هاله -->
  <circle cx="32" cy="32" r="31" fill="url(#slotAura)"/>

  <g filter="url(#slotGlow)">

    <!-- ============ بخش‌های چرخ (۸ قطاع) ============ -->
    <!-- قرمز -->
    <path d="M 32 32 L 32 8 A 24 24 0 0 1 48.97 15.03 Z" fill="#c81e1e"/>
    <!-- طلایی -->
    <path d="M 32 32 L 48.97 15.03 A 24 24 0 0 1 56 32 Z" fill="#ffd700"/>
    <!-- سبز -->
    <path d="M 32 32 L 56 32 A 24 24 0 0 1 48.97 48.97 Z" fill="#10b981"/>
    <!-- آبی -->
    <path d="M 32 32 L 48.97 48.97 A 24 24 0 0 1 32 56 Z" fill="#3b82f6"/>
    <!-- بنفش -->
    <path d="M 32 32 L 32 56 A 24 24 0 0 1 15.03 48.97 Z" fill="#a855f7"/>
    <!-- نارنجی -->
    <path d="M 32 32 L 15.03 48.97 A 24 24 0 0 1 8 32 Z" fill="#f97316"/>
    <!-- صورتی -->
    <path d="M 32 32 L 8 32 A 24 24 0 0 1 15.03 15.03 Z" fill="#ec4899"/>
    <!-- فیروزه‌ای -->
    <path d="M 32 32 L 15.03 15.03 A 24 24 0 0 1 32 8 Z" fill="#14b8a6"/>

    <!-- خطوط جداکننده قطاع‌ها -->
    <g stroke="#6b4c00" stroke-width="0.6" opacity="0.6">
      <line x1="32" y1="32" x2="32" y2="8"/>
      <line x1="32" y1="32" x2="48.97" y2="15.03"/>
      <line x1="32" y1="32" x2="56" y2="32"/>
      <line x1="32" y1="32" x2="48.97" y2="48.97"/>
      <line x1="32" y1="32" x2="32" y2="56"/>
      <line x1="32" y1="32" x2="15.03" y2="48.97"/>
      <line x1="32" y1="32" x2="8" y2="32"/>
      <line x1="32" y1="32" x2="15.03" y2="15.03"/>
    </g>

    <!-- ============ قاب بیرونی طلایی ============ -->
    <circle cx="32" cy="32" r="24"
            fill="none"
            stroke="url(#slotFrame)"
            stroke-width="2.5"/>

    <!-- حلقه داخلی نازک -->
    <circle cx="32" cy="32" r="21"
            fill="none"
            stroke="#6b4c00"
            stroke-width="0.5"
            opacity="0.6"/>

    <!-- ============ ۸ نقطه تزئینی روی قاب ============ -->
    <g fill="#fff7c2" stroke="#6b4c00" stroke-width="0.3">
      <circle cx="32" cy="8" r="1.5"/>
      <circle cx="48.97" cy="15.03" r="1.5"/>
      <circle cx="56" cy="32" r="1.5"/>
      <circle cx="48.97" cy="48.97" r="1.5"/>
      <circle cx="32" cy="56" r="1.5"/>
      <circle cx="15.03" cy="48.97" r="1.5"/>
      <circle cx="8" cy="32" r="1.5"/>
      <circle cx="15.03" cy="15.03" r="1.5"/>
    </g>

    <!-- ============ مرکز چرخ ============ -->
    <circle cx="32" cy="32" r="6"
            fill="url(#slotHub)"
            stroke="#6b4c00"
            stroke-width="0.7"/>
    <circle cx="30.5" cy="30.5" r="1.5" fill="#ffffff" opacity="0.8"/>

    <!-- ============ سوزن بالایی ============ -->
    <path d="M 32 2 L 28 12 L 36 12 Z"
          fill="url(#slotNeedle)"
          stroke="#4a0000"
          stroke-width="0.6"
          stroke-linejoin="round"/>
    <circle cx="32" cy="4" r="1.5" fill="#ffd700" stroke="#6b4c00" stroke-width="0.4"/>

    <!-- sparkles -->
    <g fill="#ffffff" opacity="0.95">
      <path d="M 54 10 L 54.7 12 L 56.7 12.7 L 54.7 13.4 L 54 15.4 L 53.3 13.4 L 51.3 12.7 L 53.3 12 Z"/>
      <path d="M 10 52 L 10.5 53.5 L 12 54 L 10.5 54.5 L 10 56 L 9.5 54.5 L 8 54 L 9.5 53.5 Z"/>
    </g>

  </g>
</svg>