<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 64 64" 
     width="64" height="64"
     role="img" 
     aria-label="سکه طلایی">

  <defs>
    <!-- گرادیانت بدنه سکه -->
    <radialGradient id="coinFace" cx="35%" cy="30%" r="75%">
      <stop offset="0%"   stop-color="#fff7c2"/>
      <stop offset="25%"  stop-color="#ffe066"/>
      <stop offset="55%"  stop-color="#ffd700"/>
      <stop offset="80%"  stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8b6300"/>
    </radialGradient>

    <!-- لبه ضخیم سکه -->
    <linearGradient id="coinEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffe066"/>
      <stop offset="50%"  stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8b6300"/>
    </linearGradient>

    <!-- حلقه داخلی -->
    <linearGradient id="coinRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fff3b0"/>
      <stop offset="50%"  stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>

    <!-- درخشش بالای سکه (specular highlight) -->
    <radialGradient id="coinHighlight" cx="35%" cy="28%" r="35%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="60%"  stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- هاله درخشش بیرونی -->
    <radialGradient id="coinAura" cx="50%" cy="50%" r="50%">
      <stop offset="55%"  stop-color="#ffd700" stop-opacity="0"/>
      <stop offset="80%"  stop-color="#ffd700" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>

    <!-- فیلتر درخشش -->
    <filter id="coinGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- هاله درخشش بیرونی -->
  <circle cx="32" cy="32" r="31" fill="url(#coinAura)"/>

  <!-- سایه پایین (برای حس 3D) -->
  <ellipse cx="32" cy="58" rx="20" ry="3.5" 
           fill="#000000" opacity="0.35"/>

  <!-- لبه سکه (فقط پایین، حس ضخامت) -->
  <ellipse cx="32" cy="32" rx="24" ry="25" fill="url(#coinEdge)"/>

  <!-- بدنه اصلی سکه -->
  <circle cx="32" cy="30" r="24" fill="url(#coinFace)"/>

  <!-- حلقه طلایی داخلی -->
  <circle cx="32" cy="30" r="19.5" 
          fill="none" 
          stroke="url(#coinRing)" 
          stroke-width="1.2"/>
  <circle cx="32" cy="30" r="17.5" 
          fill="none" 
          stroke="#fff3b0" 
          stroke-width="0.5" 
          opacity="0.7"/>

  <!-- ============ نماد مرکزی (ستاره ۸ پر) ============ -->
  <g transform="translate(32 30)" filter="url(#coinGlow)">
    <!-- ستاره طلایی -->
    <path d="M0 -12 
             L 3.2 -3.2 
             L 12 0 
             L 3.2 3.2 
             L 0 12 
             L -3.2 3.2 
             L -12 0 
             L -3.2 -3.2 Z"
          fill="url(#coinRing)"
          stroke="#8b6300"
          stroke-width="0.6"/>
    <!-- ستاره ثانویه (چرخیده) -->
    <path d="M0 -8 
             L 2.2 -2.2 
             L 8 0 
             L 2.2 2.2 
             L 0 8 
             L -2.2 2.2 
             L -8 0 
             L -2.2 -2.2 Z"
          fill="#fff7c2"
          opacity="0.85"/>
    <!-- نقطه مرکزی -->
    <circle r="1.6" fill="#b8860b"/>
    <circle r="0.8" fill="#fff3b0"/>
  </g>

  <!-- هایلایت براق بالا-چپ -->
  <ellipse cx="24" cy="20" rx="10" ry="7" 
           fill="url(#coinHighlight)" 
           opacity="0.75"/>

  <!-- براق خطی کوچک -->
  <ellipse cx="22" cy="18" rx="4" ry="2.2" 
           fill="#ffffff" 
           opacity="0.85"
           transform="rotate(-25 22 18)"/>

  <!-- نقطه درخشش -->
  <circle cx="26" cy="16" r="1.3" fill="#ffffff" opacity="0.95"/>

  <!-- خط دور (کنتور) -->
  <circle cx="32" cy="30" r="24" 
          fill="none" 
          stroke="#8b6300" 
          stroke-width="0.8" 
          opacity="0.6"/>
</svg>