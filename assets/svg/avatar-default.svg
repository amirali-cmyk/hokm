<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 128 128" 
     width="128" height="128"
     role="img" 
     aria-label="آواتار پیش‌فرض">

  <defs>
    <!-- پس‌زمینه شعاعی مخملی -->
    <radialGradient id="avBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%"   stop-color="#234035"/>
      <stop offset="50%"  stop-color="#122620"/>
      <stop offset="100%" stop-color="#0a1512"/>
    </radialGradient>

    <!-- گرادیانت قاب طلایی -->
    <linearGradient id="avFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fff7c2"/>
      <stop offset="25%"  stop-color="#ffd700"/>
      <stop offset="55%"  stop-color="#d4af37"/>
      <stop offset="80%"  stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#6b4c00"/>
    </linearGradient>

    <!-- گرادیانت سیلوئت (طلایی کم‌رنگ) -->
    <linearGradient id="avSilhouette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#d4c685"/>
      <stop offset="50%"  stop-color="#b8a76a"/>
      <stop offset="100%" stop-color="#8a7d4e"/>
    </linearGradient>

    <!-- هایلایت براق -->
    <radialGradient id="avShine" cx="30%" cy="25%" r="40%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- هاله درخشش طلایی -->
    <radialGradient id="avAura" cx="50%" cy="50%" r="50%">
      <stop offset="60%"  stop-color="#ffd700" stop-opacity="0"/>
      <stop offset="85%"  stop-color="#ffd700" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>

    <!-- برش دایره‌ای -->
    <clipPath id="avClip">
      <circle cx="64" cy="64" r="58"/>
    </clipPath>

    <!-- فیلتر درخشش -->
    <filter id="avGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- هاله درخشش بیرونی -->
  <circle cx="64" cy="64" r="63" fill="url(#avAura)"/>

  <!-- ============ محتوای داخل دایره (با clip) ============ -->
  <g clip-path="url(#avClip)">

    <!-- پس‌زمینه مخملی -->
    <rect x="0" y="0" width="128" height="128" fill="url(#avBg)"/>

    <!-- الگوی نقطه‌ای ظریف (بافت) -->
    <g fill="#ffd700" opacity="0.04">
      <circle cx="15" cy="15" r="1"/>
      <circle cx="35" cy="15" r="1"/>
      <circle cx="55" cy="15" r="1"/>
      <circle cx="75" cy="15" r="1"/>
      <circle cx="95" cy="15" r="1"/>
      <circle cx="115" cy="15" r="1"/>
      <circle cx="25" cy="35" r="1"/>
      <circle cx="45" cy="35" r="1"/>
      <circle cx="65" cy="35" r="1"/>
      <circle cx="85" cy="35" r="1"/>
      <circle cx="105" cy="35" r="1"/>
    </g>

    <!-- ============ سیلوئت کاربر ============ -->
    <!-- سر -->
    <circle cx="64" cy="52" r="20" fill="url(#avSilhouette)"/>

    <!-- گردن -->
    <rect x="56" y="68" width="16" height="12" fill="url(#avSilhouette)"/>

    <!-- شانه‌ها / بدن -->
    <path d="M 64 78 
             C 42 78, 26 92, 22 112 
             L 22 128 
             L 106 128 
             L 106 112 
             C 102 92, 86 78, 64 78 Z"
          fill="url(#avSilhouette)"/>

    <!-- ============ هایلایت براق روی سر ============ -->
    <ellipse cx="56" cy="42" rx="9" ry="6"
             fill="#ffffff"
             opacity="0.22"
             transform="rotate(-25 56 42)"/>

    <!-- هایلایت روی شانه -->
    <ellipse cx="40" cy="94" rx="10" ry="5"
             fill="#ffffff"
             opacity="0.12"
             transform="rotate(-15 40 94)"/>

  </g>

  <!-- ============ قاب طلایی ============ -->
  <!-- حلقه اصلی قاب -->
  <circle cx="64" cy="64" r="58"
          fill="none"
          stroke="url(#avFrame)"
          stroke-width="4"
          filter="url(#avGlow)"/>

  <!-- حلقه داخلی نازک -->
  <circle cx="64" cy="64" r="54"
          fill="none"
          stroke="url(#avFrame)"
          stroke-width="1"
          opacity="0.6"/>

  <!-- حلقه بیرونی نازک -->
  <circle cx="64" cy="64" r="62"
          fill="none"
          stroke="url(#avFrame)"
          stroke-width="0.6"
          opacity="0.4"/>

  <!-- ============ هایلایت براق روی قاب (بالا-چپ) ============ -->
  <path d="M 22 50 A 50 50 0 0 1 52 16"
        fill="none"
        stroke="#ffffff"
        stroke-width="2.5"
        stroke-linecap="round"
        opacity="0.55"/>

  <!-- ============ ۴ نقطه تزئینی روی قاب (مثل الماس) ============ -->
  <g fill="#fff7c2">
    <!-- بالا -->
    <circle cx="64" cy="6" r="2.5"/>
    <!-- پایین -->
    <circle cx="64" cy="122" r="2.5"/>
    <!-- چپ -->
    <circle cx="6" cy="64" r="2.5"/>
    <!-- راست -->
    <circle cx="122" cy="64" r="2.5"/>
  </g>

  <!-- نقطه براق روی هر الماس -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="63.4" cy="5.4" r="0.7"/>
    <circle cx="63.4" cy="121.4" r="0.7"/>
    <circle cx="5.4" cy="63.4" r="0.7"/>
    <circle cx="121.4" cy="63.4" r="0.7"/>
  </g>

  <!-- ============ sparkle گوشه بالا-راست ============ -->
  <g fill="#ffffff" opacity="0.9">
    <path d="M 112 14 L 112.8 16 L 114.8 16.8 L 112.8 17.6 L 112 19.6 L 111.2 17.6 L 109.2 16.8 L 111.2 16 Z"/>
  </g>
  <circle cx="112" cy="16.8" r="0.6" fill="#ffffff"/>

</svg>