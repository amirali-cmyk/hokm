<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 600 400"
     width="600"
     height="400"
     role="img"
     aria-label="راهنمای گام ۱: هدف بازی حکم">

  <title>گام ۱ — هدف بازی</title>
  <desc>۴ بازیکن در ۲ تیم روبه‌روی هم دور میز گرد نشسته‌اند. هدف: بردن ۷ دست از ۱۳ دست.</desc>

  <!-- ═══════════════════════════════════════════
       تعریف گرادیانت‌ها و فیلترها
       ═══════════════════════════════════════════ -->
  <defs>

    <!-- پس‌زمینه اصلی -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1e2d45" />
      <stop offset="55%"  stop-color="#152138" />
      <stop offset="100%" stop-color="#0d1b2a" />
    </linearGradient>

    <!-- تیم A (ما) — سبز -->
    <linearGradient id="teamAGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#06d6a0" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- تیم B (حریف) — قرمز -->
    <linearGradient id="teamBGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ef476f" />
      <stop offset="100%" stop-color="#b8304e" />
    </linearGradient>

    <!-- میز گرد — چوبی -->
    <radialGradient id="tableGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%"   stop-color="#3a4a68" />
      <stop offset="60%"  stop-color="#2a3a55" />
      <stop offset="100%" stop-color="#1a2740" />
    </radialGradient>

    <!-- طلایی -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffe97a" />
      <stop offset="50%"  stop-color="#ffd60a" />
      <stop offset="100%" stop-color="#b8860b" />
    </linearGradient>

    <!-- هاله درخشش -->
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffd60a" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffd60a" stop-opacity="0" />
    </radialGradient>

    <!-- سایه نرم -->
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="0" dy="2" result="o" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.45" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- سایه عمیق برای بازیکنان -->
    <filter id="deepShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
      <feOffset dx="0" dy="3" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

  </defs>

  <!-- ═══════════════════════════════════════════
       لایه ۱: پس‌زمینه
       ═══════════════════════════════════════════ -->
  <rect width="600" height="400" rx="20" ry="20" fill="url(#bgGrad)" />

  <!-- الگوی نقطه‌ای پس‌زمینه -->
  <g fill="#ffd60a" opacity="0.06">
    <circle cx="40"  cy="40"  r="2" />
    <circle cx="120" cy="40"  r="2" />
    <circle cx="200" cy="40"  r="2" />
    <circle cx="280" cy="40"  r="2" />
    <circle cx="360" cy="40"  r="2" />
    <circle cx="440" cy="40"  r="2" />
    <circle cx="520" cy="40"  r="2" />
    <circle cx="40"  cy="360" r="2" />
    <circle cx="120" cy="360" r="2" />
    <circle cx="200" cy="360" r="2" />
    <circle cx="280" cy="360" r="2" />
    <circle cx="360" cy="360" r="2" />
    <circle cx="440" cy="360" r="2" />
    <circle cx="520" cy="360" r="2" />
  </g>

  <!-- ═══════════════════════════════════════════
       لایه ۲: میز گرد مرکزی
       ═══════════════════════════════════════════ -->

  <!-- هاله درخشش زیر میز -->
  <ellipse cx="300" cy="200" rx="180" ry="120" fill="url(#glowCenter)" />

  <!-- سایه میز -->
  <ellipse cx="300" cy="215" rx="145" ry="90" fill="#000" opacity="0.35" filter="url(#softShadow)" />

  <!-- میز گرد -->
  <ellipse cx="300" cy="205" rx="140" ry="85"
           fill="url(#tableGrad)"
           stroke="url(#goldGrad)"
           stroke-width="3"
           filter="url(#softShadow)" />

  <!-- حلقه تزئینی داخل میز -->
  <ellipse cx="300" cy="205" rx="115" ry="68"
           fill="none"
           stroke="url(#goldGrad)"
           stroke-width="1.2"
           opacity="0.35"
           stroke-dasharray="6 4" />

  <!-- ═══════════════════════════════════════════
       لایه ۳: ۴ کارت مرکز میز (نماد دست جاری)
       ═══════════════════════════════════════════ -->
  <g filter="url(#softShadow)">
    <!-- کارت چپ بالا -->
    <g transform="translate(255 165) rotate(-15)">
      <rect x="0" y="0" width="28" height="40" rx="4"
            fill="#fffdf7"
            stroke="#c0b8a0"
            stroke-width="0.8" />
      <text x="14" y="20"
            font-family="'Playfair Display', serif"
            font-size="14"
            font-weight="900"
            fill="#1a1a1a"
            text-anchor="middle">A</text>
      <text x="14" y="34"
            font-family="sans-serif"
            font-size="11"
            fill="#1a1a1a"
            text-anchor="middle">♠</text>
    </g>

    <!-- کارت راست بالا -->
    <g transform="translate(315 165) rotate(15)">
      <rect x="0" y="0" width="28" height="40" rx="4"
            fill="#fffdf7"
            stroke="#c0b8a0"
            stroke-width="0.8" />
      <text x="14" y="20"
            font-family="'Playfair Display', serif"
            font-size="14"
            font-weight="900"
            fill="#ef476f"
            text-anchor="middle">K</text>
      <text x="14" y="34"
            font-family="sans-serif"
            font-size="11"
            fill="#ef476f"
            text-anchor="middle">♥</text>
    </g>

    <!-- کارت چپ پایین -->
    <g transform="translate(265 210) rotate(-8)">
      <rect x="0" y="0" width="28" height="40" rx="4"
            fill="#fffdf7"
            stroke="#c0b8a0"
            stroke-width="0.8" />
      <text x="14" y="20"
            font-family="'Playfair Display', serif"
            font-size="14"
            font-weight="900"
            fill="#1a1a1a"
            text-anchor="middle">Q</text>
      <text x="14" y="34"
            font-family="sans-serif"
            font-size="11"
            fill="#1a1a1a"
            text-anchor="middle">♣</text>
    </g>

    <!-- کارت راست پایین -->
    <g transform="translate(305 210) rotate(10)">
      <rect x="0" y="0" width="28" height="40" rx="4"
            fill="#fffdf7"
            stroke="#c0b8a0"
            stroke-width="0.8" />
      <text x="14" y="20"
            font-family="'Playfair Display', serif"
            font-size="14"
            font-weight="900"
            fill="#ef476f"
            text-anchor="middle">J</text>
      <text x="14" y="34"
            font-family="sans-serif"
            font-size="11"
            fill="#ef476f"
            text-anchor="middle">♦</text>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════
       لایه ۴: تیم B (حریف) — بالا
       ═══════════════════════════════════════════ -->

  <!-- بازیکن بالا-راست -->
  <g filter="url(#deepShadow)" transform="translate(420 55)">
    <circle r="32" fill="url(#teamBGrad)" stroke="#fff" stroke-width="2.5" />
    <text y="8"
          font-family="sans-serif"
          font-size="30"
          text-anchor="middle"
          fill="#fff">🤖</text>
    <text y="52"
          font-family="'Vazirmatn', sans-serif"
          font-size="12"
          font-weight="700"
          text-anchor="middle"
          fill="#ef476f">حریف ۱</text>
  </g>

  <!-- بازیکن بالا-چپ -->
  <g filter="url(#deepShadow)" transform="translate(180 55)">
    <circle r="32" fill="url(#teamBGrad)" stroke="#fff" stroke-width="2.5" />
    <text y="8"
          font-family="sans-serif"
          font-size="30"
          text-anchor="middle"
          fill="#fff">🤖</text>
    <text y="52"
          font-family="'Vazirmatn', sans-serif"
          font-size="12"
          font-weight="700"
          text-anchor="middle"
          fill="#ef476f">حریف ۲</text>
  </g>

  <!-- خط اتصال تیم B -->
  <line x1="212" y1="55" x2="388" y2="55"
        stroke="#ef476f"
        stroke-width="2"
        stroke-dasharray="4 4"
        opacity="0.55" />

  <!-- برچسب تیم B -->
  <g transform="translate(300 42)">
    <rect x="-60" y="-12" width="120" height="24" rx="12"
          fill="#ef476f"
          opacity="0.9" />
    <text y="5"
          font-family="'Vazirmatn', sans-serif"
          font-size="13"
          font-weight="700"
          text-anchor="middle"
          fill="#fff">تیم B — حریف</text>
  </g>

  <!-- ═══════════════════════════════════════════
       لایه ۵: تیم A (ما) — پایین
       ═══════════════════════════════════════════ -->

  <!-- بازیکن پایین-چپ (هم‌تیمی) -->
  <g filter="url(#deepShadow)" transform="translate(180 345)">
    <circle r="32" fill="url(#teamAGrad)" stroke="#fff" stroke-width="2.5" />
    <text y="8"
          font-family="sans-serif"
          font-size="30"
          text-anchor="middle"
          fill="#fff">🧑‍🤝‍🧑</text>
    <text y="-42"
          font-family="'Vazirmatn', sans-serif"
          font-size="12"
          font-weight="700"
          text-anchor="middle"
          fill="#06d6a0">هم‌تیمی</text>
  </g>

  <!-- بازیکن پایین-راست (خودت) -->
  <g filter="url(#deepShadow)" transform="translate(420 345)">
    <!-- هاله درخشش مخصوص خودت -->
    <circle r="42" fill="#ffd60a" opacity="0.15" />
    <circle r="32" fill="url(#teamAGrad)" stroke="#ffd60a" stroke-width="3" />
    <text y="8"
          font-family="sans-serif"
          font-size="30"
          text-anchor="middle"
          fill="#fff">😎</text>
    <text y="-42"
          font-family="'Vazirmatn', sans-serif"
          font-size="12"
          font-weight="700"
          text-anchor="middle"
          fill="#ffd60a">خودت</text>
  </g>

  <!-- خط اتصال تیم A -->
  <line x1="212" y1="345" x2="388" y2="345"
        stroke="#06d6a0"
        stroke-width="2"
        stroke-dasharray="4 4"
        opacity="0.55" />

  <!-- برچسب تیم A -->
  <g transform="translate(300 375)">
    <rect x="-60" y="-12" width="120" height="24" rx="12"
          fill="#06d6a0"
          opacity="0.9" />
    <text y="5"
          font-family="'Vazirmatn', sans-serif"
          font-size="13"
          font-weight="700"
          text-anchor="middle"
          fill="#fff">تیم A — ما</text>
  </g>

  <!-- ═══════════════════════════════════════════
       لایه ۶: نشانگر «بردن ۷ دست» بالای میز
       ═══════════════════════════════════════════ -->
  <g transform="translate(300 120)">
    <text font-family="'Vazirmatn', sans-serif"
          font-size="14"
          font-weight="700"
          text-anchor="middle"
          fill="#ffd60a"
          opacity="0.9">هدف: بردن ۷ دست از ۱۳</text>
  </g>

  <!-- شمارنده دست‌ها ۱ تا ۷ -->
  <g transform="translate(300 305)">
    <text font-family="'Vazirmatn', sans-serif"
          font-size="13"
          font-weight="700"
          text-anchor="middle"
          fill="#fff"
          opacity="0.8">🎯</text>
  </g>

  <!-- ═══════════════════════════════════════════
       لایه ۷: برچسب شماره گام (بالا-راست)
       ═══════════════════════════════════════════ -->
  <g transform="translate(548 40)">
    <circle r="22"
            fill="url(#goldGrad)"
            filter="url(#softShadow)" />
    <text y="8"
          font-family="'Playfair Display', serif"
          font-size="22"
          font-weight="900"
          text-anchor="middle"
          fill="#1a1a1a">1</text>
  </g>

  <!-- ═══════════════════════════════════════════
       لایه ۸: خط تزئینی پایین صفحه
       ═══════════════════════════════════════════ -->
  <line x1="40" y1="395" x2="560" y2="395"
        stroke="url(#goldGrad)"
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.4" />

</svg>