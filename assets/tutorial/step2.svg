    <text y="4"
          font-family="'Playfair Display', serif"
          font-size="12" font-weight="900"
          text-anchor="middle" fill="#fff">11</text>
  </g>

  <!-- 🃏 10 -->
  <g filter="url(#cardDrop2)" transform="translate(268 90) rotate(1)">
    <rect x="0" y="0" width="42" height="62" rx="6"
          fill="url(#cardWhite)" stroke="url(#greenMid)" stroke-width="1.8" />
    <text x="21" y="32"
          font-family="'Playfair Display', serif"
          font-size="20" font-weight="900"
          text-anchor="middle" fill="#1a1a1a">10</text>
    <text x="21" y="52"
          font-family="sans-serif"
          font-size="16"
          text-anchor="middle" fill="#1a1a1a">♠</text>
  </g>
  <g transform="translate(289 168)">
    <rect x="-16" y="-9" width="32" height="18" rx="9"
          fill="url(#greenMid)" opacity="0.85" />
    <text y="4"
          font-family="'Playfair Display', serif"
          font-size="12" font-weight="900"
          text-anchor="middle" fill="#fff">10</text>
  </g>

  <!-- 🃏 9 -->
  <g filter="url(#cardDrop2)" transform="translate(320 90) rotate(2)">
    <rect x="0" y="0" width="42" height="62" rx="6"
          fill="url(#cardWhite)" stroke="url(#greenMid)" stroke-width="1.6" />
    <text x="21" y="34"
          font-family="'Playfair Display', serif"
          font-size="22" font-weight="900"
          text-anchor="middle" fill="#ef476f">9</text>
    <text x="21" y="52"
          font-family="sans-serif"
          font-size="16"
          text-anchor="middle" fill="#ef476f">♥</text>
  </g>
  <g transform="translate(341 168)">
    <rect x="-16" y="-9" width="32" height="18" rx="9"
          fill="url(#greenMid)" opacity="0.75" />
    <text y="4"
          font-family="'Playfair Display', serif"
          font-size="12" font-weight="900"
          text-anchor="middle" fill="#fff">9</text>
  </g>

  <!-- 🃏 8 -->
  <g filter="url(#cardDrop2)" transform="translate(372 90) rotate(3)">
    <rect x="0" y="0" width="42" height="62" rx="6"
          fill="url(#cardWhite)" stroke="url(#greenMid)" stroke-width="1.4" />
    <text x="21" y="34"
          font-family="'Playfair Display', serif"
          font-size="22" font-weight="900"
          text-anchor="middle" fill="#1a1a1a">8</text>
    <text x="21" y="52"
          font-family="sans-serif"
          font-size="16"
          text-anchor="middle" fill="#1a1a1a">♣</text>
  </g>
  <g transform="translate(393 168)">
    <rect x="-16" y="-9" width="32" height="18" rx="9"
          fill="url(#greenMid)" opacity="0.65" />
    <text y="4"
          font-family="'Playfair Display', serif"
          font-size="12" font-weight="900"
          text-anchor="middle" fill="#fff">8</text>
  </g>

  <!-- ═══════════════════════════════════════════
       ستون دوم — از y=220
       ═══════════════════════════════════════════ -->

  <!-- 🃏 7 -->
  <g filter="url(#cardDrop2)" transform="translate(60 230) rotate(-3)">
    <rect x="0" y="0" width="42" height="62" rx="6"
          fill="url(#cardWhite)" stroke="url(#greenMid)" stroke-width="1.2" />
    <text x="21" y="34"
          font-family="'Playfair Display', serif"
          font-size="22" font-weight="900"
          text-anchor="middle" fill="#ef476f">7</text>
    <text x="21" y="52"
          font-family="sans-serif"
          font-size="16"
          text-anchor="middle" fill="#ef476f">♦</text>
  </g>
  <g transform="translate(81 308)">
    <rect x="-16" y="-9" width="32" height="18" rx="9"
          fill="url(#greenMid)" opacity="0.55" />
    <text y="4"
          font-family="'Playfair Display', serif"
          font-size="12" font-weight="900"
          text-anchor="middle" fill="#fff">7</text>
  </g>

  <!-- 🃏 6 -->
  <g filter="url(#cardDrop2)" transform="translate(112 230) rotate(-2)">
    <rect x="0" y="0" width="42" height="62" rx="6"
          fill="url(#cardWhite)" stroke="url(#orangeLow)" stroke-width="1.2" />
    <text x="21" y="34"
          font-family="'Playfair Display', serif"
          font-size="22" font-weight="900"
          text-anchor="middle" fill="#1a1a1a">6</text>
    <text x="21" y="52"
          font-family="sans-serif"
          font-size="16"
          text-anchor="middle" fill="#1a1a1a">♠</text>
  </g>
  <g transform="translate(133 308)">
    <rect x="-16" y="-9" width="32" height="18" rx="9"
          fill="url(#orangeLow)" opacity="0.8" />
    <text y="4"
          font-family="'Playfair Display', serif"
          font-size="12" font-weight="900"
          text-anchor="middle" fill="#fff">6</text>
  </g>

  <!-- 🃏 5 -->
  <g filter="url(#cardDrop2)" transform="translate(164 230) rotate(-1)">
    <rect x="0" y="0" width="42" height="62" rx="6"
          fill="url(#cardWhite)" stroke="url(#orangeLow)" stroke-width="1.2" />
    <text x="21" y="34"
          font-family="'Playfair Display', serif"
          font-size="22" font-weight="900"
          text-anchor="middle" fill="#ef476f">5</text>
    <text x="21" y="52"
          font-family="sans-serif"
          font-size="16"
          text-anchor="middle" fill="#ef476f">♥</text>
  </g>
  <g transform="translate(185 308)">
    <rect x="-16" y="-9" width="32" height="18" rx="9"
          fill="url(#orangeLow)" opacity="0.7" />
    <text y="4"
          font-family="'Playfair Display', serif"
          font-size="12" font-weight="900"
          text-anchor="middle" fill="#fff">5</text>
  </g>

  <!-- 🃏 4 -->
  <g filter="url(#cardDrop2)" transform="translate(216 230) rotate(0)">
    <rect x="0" y="0" width="42" height="62" rx="6"
          fill="url(#cardWhite)" stroke="url(#orangeLow)" stroke-width="1.2" />
    <text x="21" y="34"
          font-family="'Playfair Display', serif"
          font-size="22" font-weight="900"
          text-anchor="middle" fill="#1a1a1a">4</text>
    <text x="21" y="52"
          font-family="sans-serif"
          font-size="16"
          text-anchor="middle" fill="#1a1a1a">♣</text>
  </g>
  <g transform="translate(237 308)">
    <rect x="-16" y="-9" width="32" height="18" rx="9"
          fill="url(#orangeLow)" opacity="0.6" />
    <text y="4"
          font-family="'Playfair Display', serif"
          font-size="12" font-weight="900"
          text-anchor="middle" fill="#fff">4</text>
  </g>

  <!-- 🃏 3 -->
  <g filter="url(#cardDrop2)" transform="translate(268 230) rotate(1)">
    <rect x="0" y="0" width="42" height="62" rx="6"
          fill="url(#cardWhite)" stroke="url(#orangeLow)" stroke-width="1.2" />
    <text x="21" y="34"
          font-family="'Playfair Display', serif"
          font-size="22" font-weight="900"
          text-anchor="middle" fill="#ef476f">3</text>
    <text x="21" y="52"
          font-family="sans-serif"
          font-size="16"
          text-anchor="middle" fill="#ef476f">♦</text>
  </g>
  <g transform="translate(289 308)">
    <rect x="-16" y="-9" width="32" height="18" rx="9"
          fill="url(#orangeLow)" opacity="0.5" />
    <text y="4"
