  <!-- 🃏 2 (پایین‌ترین) -->
  <g filter="url(#cardDrop2)" transform="translate(320 230) rotate(2)">
    <rect x="0" y="0" width="42" height="62" rx="6"
          fill="url(#cardWhite)" stroke="url(#redLowest)" stroke-width="1.8" />
    <text x="21" y="34"
          font-family="'Playfair Display', serif"
          font-size="22" font-weight="900"
          text-anchor="middle" fill="#1a1a1a">2</text>
