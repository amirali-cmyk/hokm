  <!-- ═══════════════════════════════════════════
       لایه ۵: فلش راهنما (راست → چپ، از قوی به ضعیف)
       ═══════════════════════════════════════════ -->
  <g transform="translate(420 320)" opacity="0.7">
    <text font-family="'Vazirmatn', sans-serif"
          font-size="11"
          font-weight="600"
          fill="#ffd60a"
          text-anchor="middle">قوی‌تر</text>
    <path d="M -40 -8 L 40 -8 M 40 -8 L 30 -14 M 40 -8 L 30 -2"
          stroke="#ffd60a"
          stroke-width="2"
          stroke-linecap="round"
          fill="none" />
  </g>

  <!-- ═══════════════════════════════════════════
       لایه ۶: کارت پادشاه طلایی در گوشه (نماد «قوی‌ترین»)
       ═══════════════════════════════════════════ -->
  <g transform="translate(505 90)" filter="url(#cardDrop2)">
    <circle r="42" fill="url(#glow2)" />
    <g transform="translate(-27 -40) rotate(-8)">
      <rect x="0" y="0" width="54" height="80" rx="8"
            fill="url(#cardWhite)" stroke="url(#goldTop)" stroke-width="3" />
      <text x="27" y="32"
            font-family="'Playfair Display', serif"
            font-size="28" font-weight="900"
            text-anchor="middle" fill="#1a1a1a">A</text>
      <text x="27" y="62"
            font-family="sans-serif"
            font-size="24"
            text-anchor="middle" fill="#1a1a1a">♠</text>
    </g>
    <!-- تاج کوچک بالای کارت -->
    <g transform="translate(0 -52)">
      <path d="M -14 0 L -14 -8 L -7 -4 L 0 -10 L 7 -4 L 14 -8 L 14 0 Z"
            fill="url(#goldTop)"
            stroke="#8a6300"
            stroke-width="0.6"
            stroke-linejoin="round" />
      <circle cx="0" cy="-2" r="1.5" fill="#fff3b0" />
    </g>
  </g>

  <!-- متن زیر کارت طلایی -->
  <text x="505" y="180"
        font-family="'Vazirmatn', sans-serif"
        font-size="11"
        font-weight="700"
        text-anchor="middle"
        fill="#ffd60a">قوی‌ترین</text>

  <!-- ═══════════════════════════════════════════
       لایه ۷: جعبه راهنما پایین
       ═══════════════════════════════════════════ -->
  <g transform="translate(30 340)">
    <rect x="0" y="0" width="540" height="42" rx="10"
          fill="#0d1b2a"
          stroke="#ffd60a"
          stroke-width="1"
          opacity="0.85" />
    <text x="270" y="18"
          font-family="'Vazirmatn', sans-serif"
          font-size="12"
          font-weight="700"
          text-anchor="middle"
          fill="#ffd60a">💡 نکته کلیدی</text>
    <text x="270" y="34"
          font-family="'Vazirmatn', sans-serif"
          font-size="11"
          font-weight="500"
          text-anchor="middle"
          fill="#e0e1dd">
      کارت حکم بر همه کارت‌های خال‌های دیگر برتری دارد، حتی اگر ۲ حکم باشد!
    </text>
  </g>

  <!-- ═══════════════════════════════════════════
       لایه ۸: شماره گام (بالا-راست)
       ═══════════════════════════════════════════ -->
  <g transform="translate(548 40)">
    <circle r="22"
            fill="url(#goldTop)"
            filter="url(#soft2)" />
    <text y="8"
          font-family="'Playfair Display', serif"
          font-size="22"
          font-weight="900"
          text-anchor="middle"
          fill="#1a1a1a">2</text>
  </g>

</svg>