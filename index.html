<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تست منطق بازی</title>
  <style>
    body {
      background: #000;
      color: #0f0;
      font-family: Menlo, Consolas, monospace;
      font-size: 12px;
      padding: 10px;
      direction: ltr;
      text-align: left;
      line-height: 1.6;
      margin: 0;
    }
    h1 { color: #ffd60a; font-size: 14px; }
    .box {
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px;
      margin: 8px 0;
      max-height: 300px;
      overflow: auto;
    }
    button {
      background: #ffd60a;
      color: #000;
      border: 0;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
      margin: 4px 2px;
    }
    .ok { color: #06d6a0; }
    .fail { color: #ef476f; font-weight: bold; }
    .warn { color: #f4a259; }
    .info { color: #118ab2; }
    table { width: 100%; border-collapse: collapse; }
    td, th {
      border: 1px solid #333;
      padding: 4px 8px;
      font-size: 11px;
    }
    th { background: #222; color: #ffd60a; }
    .card {
      display: inline-block;
      padding: 2px 6px;
      background: #fff;
      color: #000;
      border-radius: 3px;
      margin: 1px;
      font-family: serif;
      font-weight: bold;
    }
    .card.red { color: #ef476f; }
  </style>
</head>
<body>

<h1>🧪 تست کامل منطق بازی</h1>

<div>
  <button onclick="testAll()">🔬 تست کامل</button>
  <button onclick="clearLog()">🗑️ پاک کردن</button>
</div>

<div id="output" class="box" style="min-height: 200px;"></div>

<script>
  var log = document.getElementById('output');
  function print(msg, cls) {
    cls = cls || '';
    log.innerHTML += '<div class="' + cls + '">' + msg + '</div>';
    log.scrollTop = log.scrollHeight;
  }
  function clearLog() { log.innerHTML = ''; }

  function testAll() {
    clearLog();
    print('═══════════════════════════════', 'info');
    print('🔬 تست کامل منطق بازی', 'info');
    print('═══════════════════════════════', 'info');
    print('');

    // ═══ ۱. چک لود شدن ماژول‌ها ═══
    print('📦 ۱. بررسی ماژول‌ها:', 'info');
    var modules = [
      'HokmStorage', 'HokmProfile', 'HokmAI', 'HokmGame', 'HokmUI'
    ];
    var allLoaded = true;
    modules.forEach(function(name) {
      if (window[name] && typeof window[name] === 'object') {
        print('  ✅ ' + name, 'ok');
      } else {
        print('  ❌ ' + name + ' گمشده', 'fail');
        allLoaded = false;
      }
    });

    if (!allLoaded) {
      print('');
      print('❌ بعضی ماژول‌ها لود نشدن. بقیه تست بی‌معنی است.', 'fail');
      return;
    }

    print('');

    // ═══ ۲. بررسی توابع کلیدی ═══
    print('🔧 ۲. بررسی توابع Game:', 'info');
    var functionsToCheck = [
      'start', 'playCard', 'selectHokm', 'getValidCards',
      'getState', 'getMyHand', 'debug'
    ];
    functionsToCheck.forEach(function(fn) {
      if (typeof HokmGame[fn] === 'function') {
        print('  ✅ HokmGame.' + fn + '()', 'ok');
      } else {
        print('  ❌ HokmGame.' + fn + '() گمشده', 'fail');
      }
    });
    print('');

    // ═══ ۳. تست شبیه‌سازی یک دور ═══
    print('🎮 ۳. شبیه‌سازی یک دور بازی:', 'info');

    // شروع یک بازی تست
    HokmGame.start({
      playerCount: 4,
      aiLevel: 'medium'
    }).then(function() {
      setTimeout(function() {
        // چک وضعیت
        var state = HokmGame.getState();
        print('');
        print('  📊 وضعیت فعلی:', 'info');
        print('    Phase: ' + state.phase);
        print('    Hokm: ' + (state.hokm || 'هنوز تعیین نشده'));
        print('    Current Player: ' + state.currentPlayer);
        print('');

        // کارت‌های من
        var myHand = HokmGame.getMyHand();
        print('  🎴 کارت‌های من (' + myHand.length + ' کارت):', 'info');
        var handHTML = '    ';
        myHand.forEach(function(c) {
          var cls = (c.suit === 'hearts' || c.suit === 'diamonds') ? 'card red' : 'card';
          handHTML += '<span class="' + cls + '">' + c.symbol + c.suit.charAt(0).toUpperCase() + '</span>';
        });
        print(handHTML);
        print('');

        // بررسی قانون پیروی از خال
        print('🎯 ۴. تست قانون پیروی از خال:', 'info');

        // شبیه‌سازی: فرض کن کارت اول ♠ پیک توسط بازیکن ۱ انداخته شده
        // و حالا بازیکن ۲ باید پاسخ بده
        // (این فقط یه تست فرضیست)

        var testCases = [];

        // چک کن که getValidCards درست کار می‌کنه
        try {
          var valid0 = HokmGame.getValidCards(0);
          print('  ✅ getValidCards(0) برگشت ' + valid0.length + ' کارت', 'ok');
          print('    ' + valid0.slice(0, 5).map(function(c) {
            return c.symbol + c.suit.charAt(0);
          }).join(', '));
        } catch (e) {
          print('  ❌ getValidCards(0) خطا: ' + e.message, 'fail');
        }

        print('');

        // ═══ ۵. دسترسی به __proto__ ═══
        print('🔍 ۵. بررسی نسخه game.js:', 'info');

        // چک کن که کد جدید اعمال شده
        var gameStr = HokmGame.toString();
        var hasNewCode = gameStr.indexOf('کارت غیرمجاز') !== -1 ||
                         gameStr.indexOf('SUIT_NAMES_FA') !== -1;

        if (hasNewCode) {
          print('  ✅ نسخه جدید game.js لود شده', 'ok');
        } else {
          print('  ⚠️ نسخه قدیمی game.js لود شده (کش؟)', 'warn');
        }

        print('');

        // ═══ ۶. پیام نهایی ═══
        print('═══════════════════════════════', 'info');
        print('📋 خلاصه:', 'info');
        print('');

        if (hasNewCode) {
          print('✅ کد جدید هست', 'ok');
          print('📌 اگه مشکل کارت غیرمجاز داری:', 'warn');
          print('   ممکنه از cache مرورگر باشه یا UI مستقیم اجرا کنه');
        } else {
          print('❌ کد جدید نیست!', 'fail');
          print('📌 راه‌حل:', 'warn');
          print('   1. Cache را پاک کن');
          print('   2. js/game.js را دوباره آپلود کن');
          print('   3. از Private tab استفاده کن');
        }

      }, 3000); // صبر برای توزیع و حکم
    }).catch(function(err) {
      print('  ❌ خطا در شروع بازی: ' + err.message, 'fail');
    });
  }

  // اجرای خودکار بعد ۲ ثانیه
  setTimeout(testAll, 2000);
</script>

</body>
</html>
