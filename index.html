<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛠️ دیباگر Hokm Pro</title>
  <style>
    body {
      font-family: monospace, Tahoma;
      background: #0d1b2a;
      color: #06d6a0;
      padding: 20px;
      direction: ltr;
      text-align: left;
      line-height: 1.6;
    }
    h1 { color: #ffd60a; font-size: 20px; }
    .box {
      background: #1e2d45;
      border: 1px solid #4a5b7a;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .ok { color: #06d6a0; }
    .fail { color: #ef476f; font-weight: bold; }
    .warn { color: #f4a259; }
    .info { color: #4da6d1; }
    pre { margin: 0; white-space: pre-wrap; word-break: break-all; }
    button {
      background: #ffd60a;
      color: #000;
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <h1>🛠️ دیباگر سیستم دوستان Hokm Pro</h1>
  <p class="info">این صفحه به صورت خودکار سیستم دوستان رو تست می‌کنه.</p>
  
  <button onclick="runTests()">🚀 شروع مجدد تست</button>

  <div id="output"></div>

  <!-- بارگذاری Socket.io -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <script>
    const out = document.getElementById('output');
    
    function log(msg, type = 'info') {
      let colorClass = type;
      let prefix = '[INFO]';
      if (type === 'ok') prefix = '[OK]  ';
      if (type === 'fail') prefix = '[FAIL]';
      if (type === 'warn') prefix = '[WARN]';
      
      const div = document.createElement('div');
      div.className = 'box';
      div.innerHTML = `<span class="${colorClass}">${prefix}</span> ${msg}`;
      out.appendChild(div);
      console.log(prefix, msg);
    }

    async function runTests() {
      out.innerHTML = ''; // پاک کردن خروجی قبلی
      log('شروع تست‌ها...', 'info');

      // ─── تست ۱: Socket.io ───
      if (typeof io === 'undefined') {
        log('کتابخانه Socket.io لود نشده است! (CDN مشکل دارد)', 'fail');
        return;
      } else {
        log('Socket.io با موفقیت لود شد.', 'ok');
      }

      // ─── تست ۲: کاربر (توکن) ───
      const token = localStorage.getItem('hokm_auth_token');
      if (!token) {
        log('هیچ توکنی (User ID) در localStorage پیدا نشد. یعنی کاربر لاگین نیست یا قبلاً ثبت‌نام نکرده.', 'fail');
      } else {
        log(`توکن پیدا شد: <code>${token}</code>`, 'ok');
      }

      // ─── تست ۳: اتصال به سرور (API) ───
      const API_URL = 'https://hokm-friends.onrender.com';
      log(`تلاش برای اتصال به سرور: ${API_URL}`, 'info');

      try {
        // ساخت یه درخواست ساده به سرور
        const res = await fetch(`${API_URL}/api/me`, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${token || 'no_token'}`
          }
        });
        
        if (res.ok) {
          const data = await res.json();
          log(`سرور پاسخ داد (${res.status}): ${JSON.stringify(data)}`, 'ok');
        } else if (res.status === 401) {
          log(`سرور پاسخ داد (401 Unauthorized): توکن نامعتبر است یا کاربر وجود ندارد. باید دوباره لاگین کنی.`, 'warn');
        } else {
          log(`سرور پاسخ داد اما با خطا (${res.status}).`, 'fail');
        }
      } catch (err) {
        log(`خطای شبکه هنگام اتصال به سرور: ${err.message}`, 'fail');
        log('این یعنی یا سرور Render خوابیده است، یا اینترنت قطع است، یا مشکل CORS وجود دارد.', 'warn');
      }

      // ─── تست ۴: اتصال Socket.io ───
      log('تلاش برای اتصال Socket.io...', 'info');
      
      try {
        const socket = io(API_URL, {
          transports: ['websocket'],
          timeout: 5000
        });

        socket.on('connect', () => {
          log('اتصال Socket.io با موفقیت برقرار شد!', 'ok');
          
          if (token) {
            socket.emit('auth', { userId: token });
            log('پیام احراز هویت به سرور ارسال شد.', 'info');
            
            socket.on('auth:ok', (data) => {
               log(`سرور احراز هویت را تایید کرد: ${JSON.stringify(data)}`, 'ok');
               socket.disconnect();
            });
          } else {
            socket.disconnect();
          }
        });

        socket.on('connect_error', (err) => {
          log(`خطا در اتصال Socket.io: ${err.message}`, 'fail');
        });

      } catch (err) {
        log(`خطای غیرمنتظره در Socket.io: ${err.message}`, 'fail');
      }
    }

    // اجرای خودکار بعد از لود شدن صفحه
    window.onload = runTests;
  </script>
</body>
</html>
