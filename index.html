<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تست ساده</title>
  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #0d1b2a;
      color: #fff;
      padding: 20px;
      margin: 0;
      direction: rtl;
      min-height: 100vh;
    }
    h1 { color: #ffd60a; }
    .box {
      background: #1e2d45;
      padding: 20px;
      border-radius: 10px;
      margin: 20px 0;
      border: 2px solid #ffd60a;
    }
    button {
      background: #06d6a0;
      color: #000;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
    }
    .ok { color: #06d6a0; }
    .fail { color: #ef476f; }
    #result {
      font-family: monospace;
      font-size: 12px;
      line-height: 1.8;
      margin-top: 20px;
      direction: ltr;
      text-align: left;
    }
  </style>
</head>
<body>

  <h1>🧪 تست ساده</h1>

  <div class="box">
    <p>اگر این متن رو می‌بینی، HTML کار می‌کنه ✅</p>
    <p>رنگ سبز یعنی CSS کار می‌کنه ✅</p>
    <button onclick="alert('دکمه کار می‌کنه!')">تست دکمه</button>
  </div>

  <div class="box">
    <h2>تست فایل‌های CSS اصلی:</h2>
    <div id="cssTest">در حال تست...</div>
  </div>

  <div class="box">
    <h2>تست فایل‌های JS اصلی:</h2>
    <div id="jsTest">در حال تست...</div>
  </div>

  <div class="box">
    <h2>تست Splash اصلی:</h2>
    <button onclick="testSplash()">تست Splash</button>
    <div id="splashTest"></div>
  </div>

  <div id="result"></div>

  <script>
    var result = document.getElementById('result');
    function log(msg, ok) {
      result.innerHTML += '<div class="' + (ok === true ? 'ok' : ok === false ? 'fail' : '') + '">' + msg + '</div>';
      console.log(msg);
    }

    log('═══════════════════════════');
    log('🚀 TEST STARTED');
    log('═══════════════════════════');

    // ═══ ۱. تست CSS ═══
    log('');
    log('📁 CSS FILES:');

    var cssFiles = [
      'css/base.css',
      'css/themes.css',
      'css/components.css',
      'css/screens.css',
      'css/animations.css',
      'css/responsive.css'
    ];

    var cssResults = [];

    cssFiles.forEach(function(file) {
      fetch(file, { method: 'HEAD' })
        .then(function(res) {
          var ok = res.ok;
          cssResults.push({ file: file, ok: ok });
          document.getElementById('cssTest').innerHTML +=
            '<div class="' + (ok ? 'ok' : 'fail') + '">' +
            (ok ? '✅' : '❌') + ' ' + file + ' — ' + res.status +
            '</div>';
        })
        .catch(function(err) {
          cssResults.push({ file: file, ok: false });
          document.getElementById('cssTest').innerHTML +=
            '<div class="fail">❌ ' + file + ' — ' + err.message + '</div>';
        });
    });

    // ═══ ۲. تست JS ═══
    log('');
    log('📁 JS FILES:');

    var jsFiles = [
      'js/storage.js',
      'js/themes.js',
      'js/audio.js',
      'js/profile.js',
      'js/achievements.js',
      'js/leaderboard.js',
      'js/friends.js',
      'js/tournament.js',
      'js/replay.js',
      'js/share.js',
      'js/ai.js',
      'js/game.js',
      'js/ui.js',
      'js/main.js'
    ];

    jsFiles.forEach(function(file) {
      fetch(file, { method: 'HEAD' })
        .then(function(res) {
          var ok = res.ok;
          document.getElementById('jsTest').innerHTML +=
            '<div class="' + (ok ? 'ok' : 'fail') + '">' +
            (ok ? '✅' : '❌') + ' ' + file + ' — ' + res.status +
            '</div>';
        })
        .catch(function(err) {
          document.getElementById('jsTest').innerHTML +=
            '<div class="fail">❌ ' + file + ' — ' + err.message + '</div>';
        });
    });

    // ═══ ۳. تست Splash ═══
    function testSplash() {
      var html = '';

      // بررسی وجود Splash
      fetch('index.html')
        .then(function(res) { return res.text(); })
        .then(function(text) {
          html = text;

          var checks = [
            { name: 'splashScreen', found: text.indexOf('id="splashScreen"') !== -1 },
            { name: 'btnSkipSplash', found: text.indexOf('id="btnSkipSplash"') !== -1 },
            { name: 'app', found: text.indexOf('id="app"') !== -1 },
            { name: 'btnStartGame', found: text.indexOf('id="btnStartGame"') !== -1 },
            { name: 'screen-menu', found: text.indexOf('id="screen-menu"') !== -1 },
            { name: 'Emergency Killer', found: text.indexOf('Emergency SPLASH KILLER') !== -1 || text.indexOf('Emergency Splash Killer') !== -1 || text.indexOf('killSplash') !== -1 }
          ];

          var output = '';
          var allOk = true;

          checks.forEach(function(c) {
            output += '<div class="' + (c.found ? 'ok' : 'fail') + '">' +
                      (c.found ? '✅' : '❌') + ' ' + c.name +
                      '</div>';
            if (!c.found) allOk = false;
          });

          output += '<hr>';
          output += '<div>حجم index.html: ' + text.length + ' بایت</div>';
          output += '<div>تعداد خطوط: ' + text.split('\n').length + '</div>';

          output += '<hr>';
          if (allOk) {
            output += '<div class="ok">✅ index.html کاملاً درست است</div>';
          } else {
            output += '<div class="fail">❌ بخشی از index.html گم شده</div>';
          }

          document.getElementById('splashTest').innerHTML = output;
        })
        .catch(function(err) {
          document.getElementById('splashTest').innerHTML =
            '<div class="fail">❌ خطا: ' + err.message + '</div>';
        });
    }

    // ═══ ۴. باز کردن index اصلی در iframe کوچک ═══
    setTimeout(function() {
      log('');
      log('═══════════════════════════');
      log('📄 Testing index.html in iframe...');
      log('═══════════════════════════');

      var iframe = document.createElement('iframe');
      iframe.src = 'index.html';
      iframe.style.cssText = 'width:100%;height:400px;border:2px solid #ffd60a;border-radius:10px;margin-top:20px;background:#000;';
      document.body.appendChild(iframe);

      log('اگر iframe بالا درست نمایش داده، index کار می‌کنه', null);
      log('اگر iframe سفید/سیاه است، مشکل در index.html هست', null);
    }, 2000);

  </script>

</body>
</html>
